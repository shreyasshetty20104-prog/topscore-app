<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>topscore admin</title>
<style>
  body{background:#0B0D0A;color:#EDEAE0;font-family:'IBM Plex Mono',monospace;padding:20px;max-width:640px;margin:0 auto;}
  h1{font-size:18px;}
  .card{border:1px solid #24261C;border-radius:4px;padding:16px;margin-bottom:12px;}
  .row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;}
  .row b{color:#FFB200;}
  .actions{display:flex;gap:10px;margin-top:12px;}
  button{flex:1;padding:10px;border:none;border-radius:2px;font-family:inherit;cursor:pointer;}
  .approve{background:#5FBF7A;color:#000;font-weight:700;}
  .reject{background:transparent;border:1px solid #24261C;color:#EDEAE0;}
  .empty{color:#8C8B7F;font-size:13px;}
</style>
</head>
<body>
  <h1>Pending bids</h1>
  <div id="stats" style="font-size:13px;color:#8C8B7F;margin-bottom:16px;">Loading visit stats...</div>
  <div id="list"><div class="empty">Loading...</div></div>

<script>
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

async function loadPending(){
  const list = document.getElementById('list');
  try {
    const res = await fetch('/api/pending');
    if(!res.ok){ list.innerHTML = '<div class="empty">Could not load — try refreshing.</div>'; return; }
    const bids = await res.json();

    if(bids.length === 0){
      list.innerHTML = '<div class="empty">Nothing pending right now.</div>';
      return;
    }

    list.innerHTML = bids.map(b => `
      <div class="card">
        <div class="row"><span>Account</span><b>${esc(b.name)}</b></div>
        <div class="row"><span>Amount</span><b>₹${esc(b.price)}</b></div>
        <div class="row"><span>Category</span><span>${esc(b.category)}</span></div>
        <div class="row"><span>UPI txn ID</span><span>${esc(b.upi_txn_id)}</span></div>
        <div class="row"><span>Submitted</span><span>${esc(b.created_at)}</span></div>
        <div class="actions">
          <button class="approve" onclick="act(${b.id}, 'approve')">Approve — goes live</button>
          <button class="reject" onclick="act(${b.id}, 'reject')">Reject</button>
        </div>
      </div>
    `).join('');
  } catch(e){
    list.innerHTML = '<div class="empty">Could not reach the server.</div>';
  }
}

async function act(id, action){
  await fetch(`/api/pending/${id}/${action}`, { method: 'POST' });
  loadPending();
}

loadPending();

async function loadStats(){
  try {
    const res = await fetch('/api/stats');
    if(!res.ok) return;
    const { total, today } = await res.json();
    document.getElementById('stats').textContent = `${total} total visits · ${today} today`;
  } catch(e){}
}
loadStats();
</script>
</body>
</html>
